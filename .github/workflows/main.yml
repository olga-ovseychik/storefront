name: CI

on:
  pull_request:
    branches: ["master"]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
      - run: npm ci
      - run: npm run prettier
      - run: npm run lint
      - run: npm run build
      - run: npm run test
